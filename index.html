<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>TikkaBike Menu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="main-header">
    <img src="images/logo.png" alt="TikkaBike Logo" class="logo">
    <p class="tagline">MODERN INDIAN CUISINE</p>
    <p class="location">حي الشاطئ، شارع الأمير عبدالمجيد</p>
    <input type="text" placeholder="🔍 ابحث" class="search-box">
    <button class="menu-button" onclick="scrollToMenu()">القائمة</button>
  </header>

  <main class="menu-categories" id="menu">
    <a href="#sandwiches" class="category">
      <img src="images/sandwiches.jpg" alt="ساندويتشات">
      <span>السندويتشات</span>
    </a>
    <a href="#dishes" class="category">
      <img src="images/dishes.jpg" alt="الأطباق">
      <span>الاطباق</span>
    </a>
    <a href="#snacks" class="category">
      <img src="images/snacks.jpg" alt="السناكات">
      <span>السناكات</span>
    </a>
  </main>

  <footer>
    <p>tikkabike.sa</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
